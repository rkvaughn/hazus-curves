name: Publish to PyPI

# Uses PyPI Trusted Publishing (OIDC) — no API tokens are stored in this repository.
# Before the first run, register the publisher once on PyPI:
#   PyPI -> your project -> Publishing -> Add a new pending publisher
#     Owner:            rkvaughn
#     Repository:       hazus-curves
#     Workflow name:    publish.yml
#     Environment name: pypi          (must match the `environment:` block below)
# Repeat on test.pypi.org with environment name `testpypi` for the dry run.

on:
  # Real release: publishing a GitHub Release publishes to PyPI.
  release:
    types: [published]
  # Dry run: trigger by hand to push to TestPyPI first.
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      # Catches the failure modes that are expensive to fix after upload: a version
      # number can never be reused on PyPI, so a bad README or bad metadata is
      # permanent for that release.
      - name: Check metadata and long description
        run: python -m twine check --strict dist/*

      - name: Fail if the tag does not match the package version
        if: github.event_name == 'release'
        run: |
          PKG=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "pyproject version: $PKG"
          echo "git tag:           $TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $TAG does not match pyproject version $PKG"
            exit 1
          fi

      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import hazus_curves; print('version', hazus_curves.__version__)"
          /tmp/smoke/bin/hazus-curves --help > /dev/null
          echo "wheel imports and CLI runs"

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hazus-curves
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hazus-curves
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
