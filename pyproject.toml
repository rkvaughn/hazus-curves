[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hazus-curves"
version = "0.1.0"
description = "Open database of FEMA Hazus damage and vulnerability curves"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["hazus", "fema", "flood", "hurricane", "vulnerability", "damage-functions"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
sql = ["pandas>=1.5", "pyarrow>=10", "SQLAlchemy>=2.0"]
build = ["pandas>=1.5", "openpyxl>=3.1", "pyarrow>=10", "duckdb>=1.0", "requests>=2.28"]
dev = ["pytest>=7"]

[project.scripts]
hazus-curves = "hazus_curves.cli:main"

[tool.setuptools]
packages = ["hazus_curves"]

[tool.pytest.ini_options]
testpaths = ["tests"]
